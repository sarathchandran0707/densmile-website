name: Densmile CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Automated Tests
        run: |
          chmod +x test.sh
          ./test.sh

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/densmile-website:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/densmile-website:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2 (K3s)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/densmile-website:latest

            sudo k3s kubectl set image deployment/densmile-deployment \
            densmile-container=${{ secrets.DOCKER_USERNAME }}/densmile-website:latest

            if ! sudo k3s kubectl rollout status deployment/densmile-deployment --timeout=60s; then
              echo "Deployment failed. Rolling back..."
              sudo k3s kubectl rollout undo deployment/densmile-deployment
              exit 1
            fi