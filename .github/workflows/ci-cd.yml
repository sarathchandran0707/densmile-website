name: Densmile CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Automated Tests
        run: |
          chmod +x test.sh
          ./test.sh

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t densmile-website .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml

      - name: Wait for Deployment
        run: kubectl rollout status deployment/densmile-deployment --timeout=60s

      - name: Rollback on Failure
        if: failure()
        run: |
          chmod +x rollback.sh
          ./rollback.sh